# SmartMed 后端配置（ADR-0003）
# 变量名以 backend/.env.example 为准，配置默认从 backend/.env 读取（见 spring.config.import）。
# .env 不入库（.gitignore），本机首次运行需 cp .env.example .env 后按需修改。
# .env 找不到时不报错（optional），改回退用 ${VAR:默认值} 的默认值，兼容无 .env 的环境（CI/容器等）。

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smartmed-backend
  # 导入 backend/.env：[.properties] 提示 Spring 把无扩展名的 .env 当 properties 解析（KEY=VALUE）。
  # file:.env 的 "." 是 JVM 工作目录（mvn spring-boot:run / java -jar 均为 backend/）。
  # optional: 找不到时静默跳过，不阻断启动。导入属性优先级高于本文件，故 .env 覆盖下方默认值。
  config:
    import: "optional:file:.env[.properties]"

  # ---------- PostgreSQL (CONTEXT §2) ----------
  # stringtype=unspecified：允许字符串写入 jsonb 列（prescription_template.content，ADR-0012 配套）
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartmed}?stringtype=unspecified
    username: ${DB_USER:smartmed}
    password: ${DB_PASSWORD:smartmed}
    driver-class-name: org.postgresql.Driver

  # ---------- Flyway (ADR-0008: 应用启动时自动执行迁移脚本) ----------
  # 默认扫描 classpath:db/migration（脚本放 src/main/resources/db/migration），无工作目录依赖
  flyway:
    clean-disabled: false

  # ---------- Neo4j (CONTEXT §6，02 仅配连接，09+ 才用) ----------
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:neo4j}

  # ---------- Redis (CONTEXT §2 缓存，02 暂不深度使用，预留连接) ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO          # 自增 BIGINT（CONTEXT §2 主键策略）
      logic-delete-field: null  # 物理删除（CONTEXT §2 删除策略）

# ---------- JWT (ADR-0003) ----------
# B 端 12h、C 端 7d，均无 refresh
smartmed:
  jwt:
    secret: ${JWT_SECRET:smartmed-dev-jwt-secret-change-me}
    b-expire-seconds: 43200     # 12h
    c-expire-seconds: 604800    # 7d
  agent:
    secret: ${AGENT_SECRET:smartmed-dev-agent-secret-change-me}

logging:
  level:
    com.smartmed.backend: info
