# SmartMed 开发环境中间件编排
# 一键启动: docker compose up -d
# 依赖: .env (由 .env.example 复制)
#
# 三个中间件:
#   - postgres  : pgvector/pgvector:pg16, 启动时自动执行 db/init/*.sql (DDL + 种子)
#   - redis     : redis:7-alpine
#   - neo4j     : neo4j:5, 挂载 neo4j/init/*.cypher; neo4j-init 容器在 Neo4j 就绪后用 cypher-shell 执行初始化脚本

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartmed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartmed}
      POSTGRES_DB: ${POSTGRES_DB:-smartmed}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # schema/种子数据由 Flyway 在应用启动时执行（ADR-0008），postgres 容器只建空库
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartmed} -d ${POSTGRES_DB:-smartmed}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartmed-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-smartmed} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-smartmed}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: smartmed-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-smartmed}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_export_file_enabled: "true"
      TZ: Asia/Shanghai
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=5 http://localhost:7474/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # 一次性容器: 等 Neo4j 就绪后, 用 cypher-shell 执行挂载的初始化脚本
  # Neo4j 官方镜像不原生支持启动时自动跑 .cypher, 故用此 init 容器补齐, 实现 `docker compose up` 后图谱即可查询
  neo4j-init:
    image: neo4j:5
    container_name: smartmed-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-smartmed}
    volumes:
      - ./neo4j/init:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "等待 Neo4j 就绪..."
        until cypher-shell -a bolt://neo4j:7687 -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-smartmed} "RETURN 1;" >/dev/null 2>&1; do
          echo "Neo4j 尚未就绪, 5 秒后重试..."
          sleep 5
        done
        echo "Neo4j 就绪, 开始执行初始化脚本..."
        for f in /scripts/*.cypher; do
          [ -f "$$f" ] || continue
          echo "执行 $$f ..."
          cypher-shell -a bolt://neo4j:7687 -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-smartmed} --format plain -f "$$f" || { echo "执行失败: $$f"; exit 1; }
          echo "完成: $$f"
        done
        echo "Neo4j 知识图谱初始化完成."
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
